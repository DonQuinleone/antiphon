image: alpine/latest
packages:
  - rustup
  - notmuch-dev
  - notmuch
  - build-base
  # hidapi (FIDO2 vault unlock) builds its C hidraw backend
  # against the kernel headers and libudev, found via pkg-config.
  - eudev-dev
  - pkgconf
  - linux-headers
sources:
  - https://git.sr.ht/~donquinleone/antiphon
environment:
  MSRV: "1.95"
  RUSTFLAGS: "-C target-feature=-crt-static"
tasks:
  - toolchain: |
      rustup-init -y --profile minimal --default-toolchain "$MSRV" \
          --component clippy >/dev/null
  - msrv-check: |
      cd antiphon
      PATH="$HOME/.cargo/bin:$PATH" cargo check --workspace --locked
  - test-musl: |
      cd antiphon
      PATH="$HOME/.cargo/bin:$PATH" cargo test --workspace --locked
triggers:
  - action: email
    condition: failure
    to: ~donquinleone/antiphon-devel@lists.sr.ht
