image: archlinux
packages:
  - rust
  - notmuch
  - gnupg
  - cryptsetup
  - e2fsprogs
  # hidapi (FIDO2 vault unlock) compiles its C hidraw backend,
  # so a C toolchain and pkg-config are needed; libudev ships
  # with systemd-libs from the base image.
  - gcc
  - pkgconf
  # mold links far faster than the default; the release build uses
  # it too, so proving it here keeps a release from meeting it cold.
  - mold
sources:
  - https://git.sr.ht/~donquinleone/antiphon
environment:
  RUSTFLAGS: -Clink-arg=-fuse-ld=mold
tasks:
  - fmt: |
      cd antiphon
      cargo fmt --all --check
  - clippy: |
      cd antiphon
      cargo clippy --workspace --all-targets --locked -- -D warnings
  - test: |
      cd antiphon
      cargo test --workspace --locked
  - build: |
      cd antiphon
      cargo build --workspace --locked --release
  - luks-cycle: |
      cd antiphon
      cargo build --workspace --locked
      ./scripts/ci-luks-test.sh
  - perf-smoke: |
      cd antiphon
      cargo build --release -p antiphon-store --example mailgen --example querybench
      ./target/release/examples/mailgen --root /tmp/perf-store --messages 20000 --seed 1
      ./target/release/examples/querybench /tmp/perf-store --assert-under 200
triggers:
  - action: email
    condition: failure
    to: ~donquinleone/antiphon-devel@lists.sr.ht
