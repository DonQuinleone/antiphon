[package]
name = "antiphond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sync daemon for the antiphon mail client"

[dependencies]
antiphon-config = { path = "../crates/antiphon-config" }
antiphon-ipc = { path = "../crates/antiphon-ipc" }
antiphon-oauth = { path = "../crates/antiphon-oauth" }
antiphon-store = { path = "../crates/antiphon-store" }
antiphon-sync = { path = "../crates/antiphon-sync" }
antiphon-vault = { path = "../crates/antiphon-vault" }
secrecy = "=0.10.3"
signal-hook = "=0.4.4"

[dev-dependencies]
antiphon-oauth = { path = "../crates/antiphon-oauth", features = [
    "stub",
] }
tempfile = "=3.27.0"

[build-dependencies]
antiphon-buildinfo = { path = "../crates/antiphon-buildinfo" }
