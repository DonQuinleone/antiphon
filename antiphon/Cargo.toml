[package]
name = "antiphon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A modern mail client for the terminal"

[dependencies]
antiphon-config = { path = "../crates/antiphon-config" }
antiphon-core = { path = "../crates/antiphon-core" }
antiphon-ipc = { path = "../crates/antiphon-ipc" }
antiphon-oauth = { path = "../crates/antiphon-oauth" }
antiphon-pgp = { path = "../crates/antiphon-pgp" }
antiphon-pgp-agent = { path = "../crates/antiphon-pgp-agent" }
antiphon-render = { path = "../crates/antiphon-render" }
antiphon-store = { path = "../crates/antiphon-store" }
antiphon-sync = { path = "../crates/antiphon-sync" }
antiphon-vault = { path = "../crates/antiphon-vault" }
antiphon-ui = { path = "../crates/antiphon-ui" }
age = "=0.11.1"
chrono = "=0.4.45"
flate2 = "=1.1.9"
ratatui = "=0.30.2"
clap = { version = "=4.6.4", features = ["derive"] }
portable-pty = "=0.9.0"
rpassword = "=7.5.4"
tar = "=0.4.46"
tui-term = "=0.3.4"
vt100 = "=0.16.2"

[dev-dependencies]
mail-parser = "=0.11.5"
secrecy = "=0.10.3"
tempfile = "=3.27.0"

[build-dependencies]
antiphon-buildinfo = { path = "../crates/antiphon-buildinfo" }
