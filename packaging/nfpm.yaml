# deb and rpm packages via nfpm (nfpm.goreleaser.com):
#   VERSION=x.y.z nfpm package -f packaging/nfpm.yaml -p deb
#   VERSION=x.y.z nfpm package -f packaging/nfpm.yaml -p rpm
# Run from the repository root after a release build.
name: antiphon
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: DonQuinleone <don@donquinleone.com>
description: A modern mail client for the terminal
homepage: https://git.sr.ht/~donquinleone/antiphon
license: GPL-3.0-or-later
depends:
  - notmuch
  - gnupg
contents:
  - src: target/release/antiphon
    dst: /usr/bin/antiphon
  - src: target/release/antiphond
    dst: /usr/bin/antiphond
  - src: COPYING
    dst: /usr/share/doc/antiphon/COPYING
  - src: README.md
    dst: /usr/share/doc/antiphon/README.md
