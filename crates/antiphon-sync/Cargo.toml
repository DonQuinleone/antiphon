[package]
name = "antiphon-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "IMAP sync and SMTP submission engine for antiphond"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
antiphon-store = { path = "../antiphon-store" }
imap-client = "=0.3.1"
mail-parser = "=0.11.5"
lettre = { version = "=0.11.22", default-features = false, features = [
    "smtp-transport",
    "rustls-tls",
    "hostname",
] }
tokio = { version = "=1.53.1", default-features = false, features = [
    "rt",
    "time",
] }

[dev-dependencies]
tempfile = "=3.27.0"
